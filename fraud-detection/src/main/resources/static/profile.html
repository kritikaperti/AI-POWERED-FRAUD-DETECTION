<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FraudGuard - Profile</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         USER NAVBAR
    ====================================================== -->

    <header class="user-navbar">

        <div class="logo">
            FraudGuard
        </div>


        <nav class="user-nav">

            <a href="user-dashboard.html">
                Dashboard
            </a>

            <a href="profile.html" class="active">
                Profile
            </a>

        </nav>

    </header>
    
    

    <!-- =====================================================
         PROFILE PAGE
    ====================================================== -->

    <main class="profile-page">


        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="profile-icon">
                👤
            </div>


            <div>

                <h1>
                    User Profile
                </h1>

            </div>

        </div>



        <!-- PROFILE CARD -->

        <section class="profile-card">


            <!-- NAME -->

            <div class="profile-info">

                <label>
                    Name
                </label>

                <p id="profileName">
                    USER
                </p>

            </div>



            <!-- EMAIL -->

            <div class="profile-info">

                <label>
                    Email
                </label>

                <p id="profileEmail">
                    user@fraudguard.com
                </p>

            </div>



            <!-- PHONE -->

            <div class="profile-info">

                <label>
                    Phone
                </label>

                <p id="profilePhone">
                    +91 XXXXX XXXXX
                </p>

            </div>



            <!-- USERNAME -->

            <div class="profile-info">

                <label>
                    Username
                </label>

                <p id="profileUsername">
                    USER
                </p>

            </div>



            <!-- BUTTONS -->

            <div class="profile-buttons">

                <button
                    class="edit-btn"
                    id="editProfileBtn">

                    Edit Profile

                </button>


                <button
                    class="change-password-btn"
                    id="changePasswordBtn">

                    Change Password

                </button>

            </div>


        </section>


    </main>



    <!-- =====================================================
         CHANGE PASSWORD MODAL
    ====================================================== -->

    <div
        class="password-modal"
        id="passwordModal">


        <div class="password-box">


            <!-- CLOSE BUTTON -->

            <button
                class="close-password"
                id="closePassword">

                ×

            </button>



            <h2>
                Change Password
            </h2>



            <p class="password-subtitle">

                Update your FraudGuard account password

            </p>



            <!-- CURRENT PASSWORD -->

            <label>
                Current Password
            </label>

            <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password"
            >



            <!-- NEW PASSWORD -->

            <label>
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >



            <!-- CONFIRM PASSWORD -->

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >



            <!-- SAVE PASSWORD -->

            <button
                class="password-save-btn"
                id="savePasswordBtn">

                Update Password

            </button>


        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
