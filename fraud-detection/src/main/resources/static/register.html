<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudGuard - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">FraudGuard</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<div class="form-container">

    <form id="registerForm">

        <h1>Create Account</h1>

        <div class="login-tabs">
            <button type="button" id="registerUserTab" class="tab-btn active">User</button>
            <button type="button" id="registerAdminTab" class="tab-btn">Admin</button>
        </div>

        <p id="registerTypeMessage">Create your User account</p>

        <label>Full Name</label>
        <input type="text" id="registerName" placeholder="Enter your full name" required>

        <label>Username</label>
        <input type="text" id="registerUsername" placeholder="Choose a username" required>

        <label>Email</label>
        <input type="email" id="registerEmail" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="registerPassword" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>

        <button type="submit">Register</button>

        <p id="registerMessage"></p>

        <p class="form-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
